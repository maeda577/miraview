<!doctype html>
<html lang="ja">

  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./resources/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel='stylesheet' href='./resources/MaterialSymbols.css' />
    <link rel='stylesheet' href='./resources/miraview.css' />
    <link rel="stylesheet" href="./resources/pgtable.css" />
    <link rel="stylesheet" href="./resources/pgdialog.css" />
    <script type="module" src="./js/timetable.js"></script>
    <title>番組表 - miraview</title>
  </head>

  <body class="ig-scrollbar">
    <!-- 上部バー -->
    <mrv-navbar title="番組表"></mrv-navbar>
    <!-- 左メニュー -->
    <mrv-nav-drawer></mrv-nav-drawer>
    <!-- 日付と放送波の切り替えバー -->
    <div id="pgtable-menu" style="display: flex; justify-content: center; align-items:center; padding: 0.5rem;">
      <igc-select style="width: 10rem; margin-right: 1rem;"></igc-select>
      <igc-button-group selection="single" style="--ig-size: var(--ig-size-large);">
        <igc-toggle-button disabled value="GR">GR</igc-toggle-button>
        <igc-toggle-button disabled value="BS">BS</igc-toggle-button>
        <igc-toggle-button disabled value="CS">CS</igc-toggle-button>
        <igc-toggle-button disabled value="SKY">SKY</igc-toggle-button>
      </igc-button-group>
    </div>
    <!-- 番組表 -->
    <mrv-pgtable class="main-content"></mrv-pgtable>
    <!-- 番組詳細ダイアログ -->
    <mrv-pgdialog></mrv-pgdialog>
  </body>

</html>
