<!doctype html>
<html lang="ja">

  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./resources/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel='stylesheet' href='./resources/MaterialSymbols.css' />
    <link rel='stylesheet' href='./resources/miraview.css' />
    <link rel="stylesheet" href="./resources/pgtable.css" />
    <!-- <link id="theme-css" rel='stylesheet' href='./themes/light/material.css' /> -->
    <link id="theme-css" rel='stylesheet' href='./themes/dark/material.css' />
    <style type="text/css">
      igc-navbar:not(:defined),
      igc-nav-drawer:not(:defined),
      igc-dialog:not(:defined) {
        display: none;
      }

      #dialog-programinfo-paragraphs>p {
        margin-block-start: 0;
      }
    </style>
    <script type="module" src="./js/timetable.js"></script>
    <title>番組表 - miraview</title>
  </head>

  <body>
    <!-- 上部バー -->
    <igc-navbar>
      <igc-icon-button variant="flat" slot="start">
        <span class="material-symbols-outlined">menu</span>
      </igc-icon-button>
      <span>番組表</span>
    </igc-navbar>
    <!-- 左メニュー -->
    <igc-nav-drawer position="start">
      <igc-nav-drawer-header-item>miraview</igc-nav-drawer-header-item>
      <!-- ここに igc-nav-drawer-item が入る -->
    </igc-nav-drawer>
    <!-- 日付と放送波の切り替えバー -->
    <div id="pgtable-menu" style="display: flex; justify-content: center; align-items:center; padding: 0.5rem;">
      <igc-select style="width: 10rem; margin-right: 1rem;"></igc-select>
      <igc-button-group selection="single-required" style="--ig-size: var(--ig-size-large);">
        <igc-toggle-button disabled value="GR">GR</igc-toggle-button>
        <igc-toggle-button disabled value="BS">BS</igc-toggle-button>
        <igc-toggle-button disabled value="CS">CS</igc-toggle-button>
        <igc-toggle-button disabled value="SKY">SKY</igc-toggle-button>
      </igc-button-group>
    </div>
    <!-- 番組表 -->
    <mrv-pgtable class="main-content">
    </mrv-pgtable>
    <!-- 番組クリックのダイアログ slot="footer" がついていない要素は毎回消える -->
    <igc-dialog id="mrv-pgtable-dialog" close-on-outside-click>
      <igc-button id="dialog-programinfo-recbutton" variant="flat" slot="footer">録画予約</igc-button>
      <igc-button id="dialog-programinfo-closebutton" variant="flat" slot="footer">OK</igc-button>
    </igc-dialog>
  </body>

</html>
