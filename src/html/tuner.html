<html lang="ja">

  <head>
    <meta charset="UTF-8" />
    <script type="importmap">
      {
        "imports": {
          "openapi-fetch/": "../modules/openapi-fetch/",
          "@siemens/": "../modules/@siemens/",
          "@siemens/ix": "../modules/@siemens/ix/dist/esm/index.js"
        }
      }
    </script>
    <script type="module" src="../js/tuner.js"></script>
    <link rel="stylesheet" href="../modules/@siemens/ix/dist/siemens-ix/siemens-ix.css" />
    <link rel="icon" href="../icon/favicon.svg" sizes="any" type="image/svg+xml" />
    <style type="text/css">
      ix-basic-navigation:not(:defined),
      ix-content:not(:defined) {
        display: none;
      }
    </style>
    <title>チューナー | miraview</title>
  </head>

  <body>
    <ix-basic-navigation hide-header>
      <!-- 左メニュー 各画面で共通 -->
      <ix-menu i-1-8n-legal="バージョン情報">
        <ix-menu-item icon="table">番組表</ix-menu-item>
        <ix-menu-item icon="circle-play">ライブ視聴</ix-menu-item>
        <ix-menu-item icon="search">番組検索</ix-menu-item>
        <ix-menu-item icon="history">タイムシフト</ix-menu-item>
        <ix-menu-item icon="scheduler">録画予約</ix-menu-item>
        <ix-menu-item icon="video-file">録画一覧</ix-menu-item>
        <ix-menu-item icon="radio-waves" active>チューナー</ix-menu-item>
        <ix-menu-item icon="cogwheel">設定</ix-menu-item>
        <ix-menu-about label="バージョン情報">
          <ix-menu-about-item label="バージョン">
            <ix-key-value-list>
              <ix-key-value id="mirakc-version" label="mirakc"></ix-key-value>
              <ix-key-value id="miraview-version" label="miraview"></ix-key-value>
            </ix-key-value-list>
          </ix-menu-about-item>
          <ix-menu-about-item id="menu-license" label="ライセンス"
            style="height: 80vh; overflow-x: scroll;">
          </ix-menu-about-item>
        </ix-menu-about>
      </ix-menu>
      <!-- コンテンツ領域 -->
      <ix-content>
        <!-- ヘッダ -->
        <ix-content-header slot="header" header-title="チューナー">
          <ix-icon-button id="button-reload" icon="reload" oval variant="primary"></ix-icon-button>
          <ix-tooltip for="ix-content-header ix-icon-button">
            再読み込み
          </ix-tooltip>
        </ix-content-header>
        <ix-card-list id="card-list" list-style="stack"></ix-card-list>
      </ix-content>
    </ix-basic-navigation>
    <template id="template-tuner">
      <ix-card variant="filled">
        <ix-card-content>
          <span class="span-name typography-display"></span>
          <span class="span-type typography-label"></span>
          <ix-pill class="pill-free" variant="success" hidden>Free</ix-pill>
          <ix-pill class="pill-scanning" variant="warning" hidden>Using</ix-pill>
          <ix-pill class="pill-recording" variant="alarm" hidden>Using</ix-pill>
          <ix-key-value-list></ix-key-value-list>
        </ix-card-content>
      </ix-card>
    </template>
  </body>

</html>
