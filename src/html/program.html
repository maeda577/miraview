<html lang="ja">

  <head>
    <meta charset="UTF-8" />
    <script type="importmap">
      {
        "imports": {
          "openapi-fetch/": "../modules/openapi-fetch/",
          "@siemens/": "../modules/@siemens/",
          "@siemens/ix": "../modules/@siemens/ix/dist/esm/index.js"
        }
      }
    </script>
    <script type="module" src="../js/program.js"></script>
    <link rel="stylesheet" href="../modules/@siemens/ix/dist/siemens-ix/siemens-ix.css" />
    <link rel="stylesheet" href="../css/pgtable.css" />
    <link rel="icon" href="../icon/project-server.svg" sizes="any" type="image/svg+xml" />
    <style type="text/css">
      ix-basic-navigation:not(:defined),
      ix-content:not(:defined) {
        display: none;
      }
    </style>
    <title>番組表 | miraview</title>
  </head>

  <body class="theme-classic-dark">
    <ix-basic-navigation hide-header>
      <!-- 左メニュー 各画面で共通 -->
      <ix-menu i-1-8n-legal="バージョン情報">
        <ix-menu-item icon="table" active>番組表</ix-menu-item>
        <ix-menu-item icon="circle-play">ライブ視聴</ix-menu-item>
        <ix-menu-item icon="search">番組検索</ix-menu-item>
        <ix-menu-item icon="history">タイムシフト</ix-menu-item>
        <ix-menu-item icon="scheduler">録画予約</ix-menu-item>
        <ix-menu-item icon="video-file">録画一覧</ix-menu-item>
        <ix-menu-item icon="radio-waves">チューナー</ix-menu-item>
        <ix-menu-item icon="cogwheel" bottom>設定</ix-menu-item>
        <ix-menu-about label="バージョン情報">
          <ix-menu-about-item label="バージョン">
            <p class="typography-label-lg"><span>mirakc version: </span><span id="mirakc-version"></span></p>
            <p class="typography-label-lg"><span>miraview version: </span><span id="miraview-version"></span></p>
          </ix-menu-about-item>
          <ix-menu-about-item id="menu-license" label="ライセンス"
            style="height: 80vh; overflow-x: scroll;"></ix-menu-about-item>
        </ix-menu-about>
      </ix-menu>
      <!-- コンテンツ領域 -->
      <ix-content>
        <!-- ヘッダ -->
        <ix-content-header slot="header" header-title="番組表">
          <ix-select id="dropdown-pgtable-day" hide-list-header></ix-select>
          <ix-tabs id="tab-pgtable-type" small>
            <ix-tab-item>GR</ix-tab-item>
            <ix-tab-item>BS</ix-tab-item>
            <ix-tab-item>CS</ix-tab-item>
            <ix-tab-item>SKY</ix-tab-item>
          </ix-tabs>
        </ix-content-header>
        <!-- ロード中画面 -->
        <ix-spinner id="cover-loading" size="large" class="flex-center"></ix-spinner>
        <!-- 番組が見つからなかった画面 -->
        <ix-empty-state id="cover-not-found" class="flex-center" hidden
          header="番組情報が見つかりません"
          sub-header="設定を確認してください"
          icon="alarm">
        </ix-empty-state>
        <!-- 通常の画面 番組表 -->
        <div id="pgtable-container" class="pgtable-container" hidden>
          <!-- 現在時刻の横棒 -->
          <hr id="now-line" class="pgtable-now-line" />
          <!-- 番組表本体 -->
          <table class="typography-body">
            <thead>
              <tr id="row-header">
                <th>
                  <div class="pgtable-first-cell"></div>
                </th>
              </tr>
            </thead>
            <tbody>
              <tr id="row-program">
                <th>
                  <div class="pgtable-hour">5</div>
                  <div class="pgtable-hour">6</div>
                  <div class="pgtable-hour">7</div>
                  <div class="pgtable-hour">8</div>
                  <div class="pgtable-hour">9</div>
                  <div class="pgtable-hour">10</div>
                  <div class="pgtable-hour">11</div>
                  <div class="pgtable-hour">12</div>
                  <div class="pgtable-hour">13</div>
                  <div class="pgtable-hour">14</div>
                  <div class="pgtable-hour">15</div>
                  <div class="pgtable-hour">16</div>
                  <div class="pgtable-hour">17</div>
                  <div class="pgtable-hour">18</div>
                  <div class="pgtable-hour">19</div>
                  <div class="pgtable-hour">20</div>
                  <div class="pgtable-hour">21</div>
                  <div class="pgtable-hour">22</div>
                  <div class="pgtable-hour">23</div>
                  <div class="pgtable-hour">0</div>
                  <div class="pgtable-hour">1</div>
                  <div class="pgtable-hour">2</div>
                  <div class="pgtable-hour">3</div>
                  <div class="pgtable-hour">4</div>
                </th>
              </tr>
            </tbody>
          </table>
        </div>
      </ix-content>
    </ix-basic-navigation>
    <!-- テンプレート チャンネル名を出すセル -->
    <template id="template-pgtable-ch-header">
      <th>
        <div class="pgtable-ch-header flex-center">
          <span>xx放送</span>
        </div>
      </th>
    </template>
    <!-- テンプレート 番組情報 高さとクリックイベントはJavascriptで設定する -->
    <template id="template-pgtable-item">
      <div class="pgtable-item">
        <a>xx:xx ニュース</a>
      </div>
    </template>
    <!-- テンプレート 番組詳細のダイアログ -->
    <template id="template-pgtable-modal">
      <div>
        <ix-modal-header id="modal-title"></ix-modal-header>
        <ix-modal-content style="max-height: 60vh;">
          <p id="modal-pay-tv" hidden>[有料放送]</p>
          <div id="modal-description"></div>
          <table style="margin-top: 1rem;">
            <tbody>
              <tr>
                <td>Video</td>
                <td style="padding-right: 1rem;">:</td>
                <td id="modal-video"></td>
              </tr>
              <tr>
                <td>Audio</td>
                <td style="padding-right: 1rem;">:</td>
                <td id="modal-audio"></td>
              </tr>
              <tr>
                <td>Genre</td>
                <td style="padding-right: 1rem;">:</td>
                <td id="modal-genre"></td>
              </tr>
              <tr>
                <td>Program ID</td>
                <td style="padding-right: 1rem;">:</td>
                <td id="modal-program-id"></td>
              </tr>
              <tr>
                <td>Service ID</td>
                <td style="padding-right: 1rem;">:</td>
                <td id="modal-service-id"></td>
              </tr>
            </tbody>
          </table>
        </ix-modal-content>
        <ix-modal-footer>
          <ix-button id="modal-button-close" outline>閉じる</ix-button>
          <ix-button id="modal-button-rec" hidden>録画予約</ix-button>
        </ix-modal-footer>
      </div>
    </template>
  </body>

</html>
