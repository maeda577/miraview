<html lang="ja">

  <head>
    <meta charset="UTF-8" />
    <script type="importmap">
      {
        "imports": {
          "openapi-fetch/": "./node_modules/openapi-fetch/"
        }
      }
    </script>
    <script type="module" src="./carbon/carbon.js"></script>
    <script type="module" src="./js/programs.js"></script>
    <link rel="stylesheet" href="./carbon/carbon.css" />
    <link rel="stylesheet" href="./css/main-tag.css" />
    <style type="text/css">
      cds-header:not(:defined),
      cds-side-nav:not(:defined),
      cds-modal:not(:defined) {
        display: none;
      }

      body {
        /* 1時間あたりの高さ */
        --height-per-hour: 240px;
        /* チャンネルヘッダの高さ */
        --channel-header-height: 2rem;
        /* チャンネルヘッダの幅 */
        --channel-header-width: 10rem;
        /* 左端の時間表示の幅 */
        --hour-header-width: 2rem;

        /* 現在時刻の横棒のための変数 jsで随時更新する */
        /* 午前5時を基準とした現在時刻 */
        --now-msec-from-5am: 1;
        /* 今表示されているチャンネル数 */
        --service-count: 1;
      }

      /* 番組表のガワ部分 */
      .pgtable-container {
        display: block;
        overflow: scroll;
        height: calc(100% - 3rem);
        font-size: var(--cds-body-compact-01-font-size);
      }

      .pgtable-container th,
      .pgtable-container td {
        vertical-align: top;
      }

      .pgtable-container th {
        position: sticky;
        top: 0px;
        left: 0px;
        z-index: 10;
      }

      /* 各種div用 チャンネルヘッダ・左の時刻・各番組・右上の何も無いセル */
      .pgtable-ch-header,
      .pgtable-hour,
      .pgtable-item,
      .pgtable-first-cell {
        position: sticky;
        border-width: 1px;
        border-style: solid;
        border-color: var(--cds-border-tile-01);
      }

      .pgtable-ch-header,
      .pgtable-hour,
      .pgtable-first-cell {
        background-color: var(--cds-layer-02);
      }

      .pgtable-ch-header {
        height: var(--channel-header-height);
        min-width: var(--channel-header-width);
        max-width: var(--channel-header-width);
        padding-top: calc((var(--channel-header-height) - 1rem) / 2);
      }

      .pgtable-hour {
        top: var(--channel-header-height);
        height: var(--height-per-hour);
        width: var(--hour-header-width);
        padding-top: 1rem;
      }

      .pgtable-first-cell {
        height: var(--channel-header-height);
      }

      /* 1個の番組情報 */
      .pgtable-item {
        top: var(--channel-header-height);
        padding: 0 5px;
        /* 上下のpaddingをつけると番組表の時刻がずれる */
        overflow: hidden;
        background-color: var(--cds-layer-01);
      }

      /* ダミー番組の場合は背景を暗くする */
      .pgtable-item:not(:has(a)) {
        background-color: var(--cds-layer-00);
      }

      /* 番組情報のリンク */
      .pgtable-item a {
        color: var(--cds-text-primary);
      }

      .pgtable-item a:hover {
        cursor: pointer;
        text-decoration: underline;
      }

      /* 現在時刻の横棒 */
      .pgtable-now-line {
        border-width: 1px;
        border-style: solid;
        position: relative;
        opacity: 0.5;
        border-color: var(--cds-border-interactive);
        z-index: 5;
        margin: 0;
        top: calc(var(--now-msec-from-5am) / 1000 / 60 / 60 * var(--height-per-hour) + var(--channel-header-height));
        width: calc(var(--service-count) * var(--channel-header-width) + var(--hour-header-width));
      }
    </style>
    <title>番組表 | miraview</title>
  </head>

  <body>
    <!-- ヘッダとメニュー 各画面で共通 -->
    <cds-header>
      <cds-header-menu-button></cds-header-menu-button>
      <cds-header-name prefix="miraview">[番組表]</cds-header-name>
      <cds-side-nav collapse-mode="rail">
        <cds-side-nav-items>
          <cds-side-nav-link id="menu-link-program" href="#" large active>
            <span>番組表</span>
          </cds-side-nav-link>
          <cds-side-nav-link id="menu-link-live" href="#" large>
            <span>ライブ視聴</span>
          </cds-side-nav-link>
          <cds-side-nav-link id="menu-link-search" href="#" large>
            <span>番組検索</span>
          </cds-side-nav-link>
          <cds-side-nav-link id="menu-link-timeshift" href="#" large>
            <span>タイムシフト</span>
          </cds-side-nav-link>
          <cds-side-nav-link id="menu-link-schedule" href="#" large>
            <span>録画予約</span>
          </cds-side-nav-link>
          <cds-side-nav-link id="menu-link-recorded" href="#" large>
            <span>録画一覧</span>
          </cds-side-nav-link>
          <cds-side-nav-link id="menu-link-tuner" href="#" large>
            <span>チューナー</span>
          </cds-side-nav-link>
          <cds-side-nav-divider></cds-side-nav-divider>
          <cds-side-nav-link id="menu-link-setting" href="./setting.html" large>
            <span>設定</span>
          </cds-side-nav-link>
        </cds-side-nav-items>
      </cds-side-nav>
    </cds-header>

    <!-- ヘッダとメニュー ここまで -->
    <main>
      <!-- 日付・放送波切り替え部分 -->
      <div style="display:flex; margin-bottom: 1rem;">
        <cds-content-switcher id="channel-type-switcher" style="margin-right: 1rem; width: 20rem;">
          <cds-content-switcher-item disabled value="GR">GR</cds-content-switcher-item>
          <cds-content-switcher-item disabled value="BS">BS</cds-content-switcher-item>
          <cds-content-switcher-item disabled value="CS">CS</cds-content-switcher-item>
          <cds-content-switcher-item disabled value="SKY">SKY</cds-content-switcher-item>
        </cds-content-switcher>
        <cds-tabs id="day-tabs"></cds-tabs>
      </div>
      <!-- ロード中のプレースホルダー サイズ調整の仕方が分からないので連打している -->
      <div id="loading-container">
        <cds-skeleton-placeholder></cds-skeleton-placeholder>
        <cds-skeleton-placeholder></cds-skeleton-placeholder>
        <cds-skeleton-placeholder></cds-skeleton-placeholder>
        <cds-skeleton-placeholder></cds-skeleton-placeholder>
      </div>
      <!-- 番組表 -->
      <div id="pgtable-container" class="pgtable-container hidden">
        <!-- 現在時刻の横棒 -->
        <hr id="now-line" class="pgtable-now-line" />
        <table>
          <thead>
            <tr id="row-header">
              <th>
                <div class="pgtable-first-cell"></div>
              </th>
            </tr>
          </thead>
          <tbody>
            <tr id="row-program">
              <th>
                <div class="pgtable-hour">5</div>
                <div class="pgtable-hour">6</div>
                <div class="pgtable-hour">7</div>
                <div class="pgtable-hour">8</div>
                <div class="pgtable-hour">9</div>
                <div class="pgtable-hour">10</div>
                <div class="pgtable-hour">11</div>
                <div class="pgtable-hour">12</div>
                <div class="pgtable-hour">13</div>
                <div class="pgtable-hour">14</div>
                <div class="pgtable-hour">15</div>
                <div class="pgtable-hour">16</div>
                <div class="pgtable-hour">17</div>
                <div class="pgtable-hour">18</div>
                <div class="pgtable-hour">19</div>
                <div class="pgtable-hour">20</div>
                <div class="pgtable-hour">21</div>
                <div class="pgtable-hour">22</div>
                <div class="pgtable-hour">23</div>
                <div class="pgtable-hour">0</div>
                <div class="pgtable-hour">1</div>
                <div class="pgtable-hour">2</div>
                <div class="pgtable-hour">3</div>
                <div class="pgtable-hour">4</div>
              </th>
            </tr>
          </tbody>
        </table>
      </div>
      <!-- 番組クリック時のダイアログ -->
      <cds-modal id="modal-program">
        <cds-modal-header>
          <cds-modal-close-button></cds-modal-close-button>
          <cds-modal-label id="modal-time"></cds-modal-label>
          <cds-modal-heading id="modal-title"></cds-modal-heading>
        </cds-modal-header>
        <cds-modal-body>
          <cds-modal-body-content>
            <p id="modal-pay-tv" hidden>[有料放送]</p>
            <p id="modal-description"></p>
            <p id="modal-extended" hidden></p>
            <table style="margin-top: 1rem;">
              <tbody>
                <tr>
                  <td>Video</td>
                  <td style="padding-right: 1rem;">:</td>
                  <td id="modal-video"></td>
                </tr>
                <tr>
                  <td>Audio</td>
                  <td style="padding-right: 1rem;">:</td>
                  <td id="modal-audio"></td>
                </tr>
                <tr>
                  <td>Genre</td>
                  <td style="padding-right: 1rem;">:</td>
                  <td id="modal-genre"></td>
                </tr>
                <tr>
                  <td>Program ID</td>
                  <td style="padding-right: 1rem;">:</td>
                  <td id="modal-program-id"></td>
                </tr>
                <tr>
                  <td>Service ID</td>
                  <td style="padding-right: 1rem;">:</td>
                  <td id="modal-service-id"></td>
                </tr>
              </tbody>
            </table>
          </cds-modal-body-content>
        </cds-modal-body>
        <cds-modal-footer>
          <cds-modal-footer-button kind="secondary" data-modal-close>閉じる</cds-modal-footer-button>
          <cds-modal-footer-button kind="primary">録画予約</cds-modal-footer-button>
        </cds-modal-footer>
      </cds-modal>
    </main>
    <!-- テンプレート -->
    <!-- チャンネル名を出すセル -->
    <template id="template-pgtable-ch-header">
      <th>
        <div class="pgtable-ch-header">
          <span>xx放送</span>
        </div>
      </th>
    </template>
    <!-- 番組情報 高さとクリックイベントはJavascriptで設定する -->
    <template id="template-pgtable-item">
      <div class="pgtable-item">
        <a>xx:xx ニュース</a>
      </div>
    </template>
  </body>

</html>
