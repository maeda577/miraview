<html lang="ja">

  <head>
    <meta charset="UTF-8" />
    <script type="importmap">
      {
        "imports": {
          "openapi-fetch": "./openapi-fetch/index.js"
        }
      }
    </script>
    <script type="module" src="./carbon/carbon.js"></script>
    <script type="module" src="./js/setting.js"></script>
    <link rel="stylesheet" href="./carbon/carbon.css" />
    <link rel="stylesheet" href="./css/main-tag.css" />
    <style type="text/css">
      cds-header:not(:defined),
      cds-side-nav:not(:defined),
      cds-button:not(:defined) {
        display: none;
      }
    </style>
    <title>設定 | miraview</title>
  </head>

  <body>
    <cds-header>
      <cds-header-menu-button></cds-header-menu-button>
      <cds-header-name prefix="miraview">[設定]</cds-header-name>
      <cds-side-nav collapse-mode="rail">
        <cds-side-nav-items>
          <cds-side-nav-link id="menu-link-program" href="./programs.html" large>
            <span>番組表</span>
          </cds-side-nav-link>
          <cds-side-nav-link id="menu-link-live" href="#" large>
            <span>ライブ視聴</span>
          </cds-side-nav-link>
          <cds-side-nav-link id="menu-link-search" href="#" large>
            <span>番組検索</span>
          </cds-side-nav-link>
          <cds-side-nav-link id="menu-link-timeshift" href="#" large>
            <span>タイムシフト</span>
          </cds-side-nav-link>
          <cds-side-nav-link id="menu-link-schedule" href="#" large>
            <span>録画予約</span>
          </cds-side-nav-link>
          <cds-side-nav-link id="menu-link-recorded" href="#" large>
            <span>録画一覧</span>
          </cds-side-nav-link>
          <cds-side-nav-link id="menu-link-tuner" href="#" large>
            <span>チューナー</span>
          </cds-side-nav-link>
          <cds-side-nav-divider></cds-side-nav-divider>
          <cds-side-nav-link id="menu-link-setting" href="#" large active>
            <span>設定</span>
          </cds-side-nav-link>
        </cds-side-nav-items>
      </cds-side-nav>
    </cds-header>
    <main>
      <!-- 入力フォーム cds-form-groupを使ってもrequiredバリデーションは動かなかった 頑張ってJS側で検証する -->
      <cds-stack gap="7">
        <h4>接続先mirakc設定</h4>
        <cds-text-input id="input-endpoint"
          label="接続先mirakcのAPIエンドポイント"
          helper-text="デフォルト値はこのmiraviewが動いているホストです。通常変更する必要はありません。変更する際はブラウザのCORS制限に注意してください。"
          warn-text="空欄の場合はデフォルト値に置き換えられます"
          invalid-text="URL形式が不正です">
        </cds-text-input>
        <cds-inline-notification
          id="notification-save"
          class="hidden"
          title="Notification title"
          subtitle="Subtitle text goes here.">
        </cds-inline-notification>
        <div>
          <cds-button id="button-save" type="submit">保存</cds-button>
        </div>
      </cds-stack>
    </main>
  </body>

</html>
