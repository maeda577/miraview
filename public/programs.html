<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./ix/siemens-ix.css"> -->
    <link rel="stylesheet" href="./css/carbon.css"/>
    <script type="module" src="./js/programs.js"></script>
    <style type="text/css">
      cds-header:not(:defined), cds-side-nav:not(:defined) {
        display: none;
      }
    </style>
    <title>番組表 | miraview</title>
  </head>
  <body>
    <!-- ヘッダとメニュー 各画面で共通 -->
    <cds-header>
      <cds-header-menu-button></cds-header-menu-button>
      <cds-header-name prefix="miraview">[番組表]</cds-header-name>
      <div style="display: flex; flex: auto; justify-content: flex-end;">
        <cds-header-global-action aria-label="Search" tooltip-text="Search" kind="primary" size="lg" tooltip-alignment="" tooltip-position="bottom" type="button">
          <svg focusable="false" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" fill="currentColor" aria-hidden="true" width="20" height="20" viewBox="0 0 32 32" slot="icon">
            <path d="M29,27.5859l-7.5521-7.5521a11.0177,11.0177,0,1,0-1.4141,1.4141L27.5859,29ZM4,13a9,9,0,1,1,9,9A9.01,9.01,0,0,1,4,13Z" />
          </svg>
        </cds-header-global-action>
      </div>
    </cds-header>
    <cds-side-nav collapse-mode="rail">
      <cds-side-nav-items>
        <cds-side-nav-link id="menu-link-program" href="#" large active>
          <span>番組表</span>
        </cds-side-nav-link>
        <cds-side-nav-link id="menu-link-live" href="#" large>
          <span>ライブ視聴</span>
        </cds-side-nav-link>
        <cds-side-nav-link id="menu-link-search" href="#" large>
          <span>番組検索</span>
        </cds-side-nav-link>
        <cds-side-nav-link id="menu-link-timeshift" href="#" large>
          <span>タイムシフト</span>
        </cds-side-nav-link>
        <cds-side-nav-link id="menu-link-schedule" href="#" large>
          <span>録画予約</span>
        </cds-side-nav-link>
        <cds-side-nav-link id="menu-link-recorded" href="#" large>
          <span>録画一覧</span>
        </cds-side-nav-link>
        <cds-side-nav-link id="menu-link-tuner" href="#" large>
          <span>チューナー</span>
        </cds-side-nav-link>
        <cds-side-nav-divider></cds-side-nav-divider>
        <cds-side-nav-link id="menu-link-setting" href="./setting.html" large>
          <span>設定</span>
        </cds-side-nav-link>
      </cds-side-nav-items>
    </cds-side-nav>
    <!-- ヘッダとメニュー ここまで -->
    <main>
      <div style="display:flex; margin-bottom: 1rem;">
        <cds-dropdown id="day-dropdown"></cds-dropdown>
        <cds-content-switcher style="margin-left: 1rem; width: 20rem;" value="gr">
          <cds-content-switcher-item value="gr">GR</cds-content-switcher-item>
          <cds-content-switcher-item value="bs">BS</cds-content-switcher-item>
          <cds-content-switcher-item value="cs">CS</cds-content-switcher-item>
          <cds-content-switcher-item value="sky">SKY</cds-content-switcher-item>
        </cds-content-switcher>
      </div>
      <!-- <cds-tabs id="day-tabs"></cds-tabs> -->
      <table>
        <thead>
          <tr id="service-header">
            <th></th>
            <th scope="col">ＮＨＫ総合１・東京</th>
            <th scope="col">ＮＨＫＥテレ１東京</th>
            <th scope="col">日テレ１</th>
            <th scope="col">日テレ１</th>
            <th scope="col">日テレ１</th>
            <th scope="col">日テレ１</th>
            <th scope="col">日テレ１</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row">
              <div class="program-table-hour">5</div>
              <div class="program-table-hour">6</div>
              <div class="program-table-hour">7</div>
              <div class="program-table-hour">8</div>
              <div class="program-table-hour">9</div>
              <div class="program-table-hour">10</div>
              <div class="program-table-hour">11</div>
              <div class="program-table-hour">12</div>
              <div class="program-table-hour">13</div>
              <div class="program-table-hour">14</div>
              <div class="program-table-hour">15</div>
              <div class="program-table-hour">16</div>
              <div class="program-table-hour">17</div>
              <div class="program-table-hour">18</div>
              <div class="program-table-hour">19</div>
              <div class="program-table-hour">20</div>
              <div class="program-table-hour">21</div>
              <div class="program-table-hour">22</div>
              <div class="program-table-hour">23</div>
              <div class="program-table-hour">0</div>
              <div class="program-table-hour">1</div>
              <div class="program-table-hour">2</div>
              <div class="program-table-hour">3</div>
              <div class="program-table-hour">4</div>
            </th>
          </tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
